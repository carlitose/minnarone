# Example agent configuration (public streamer scenario).
# Operational MVP fields plus v2 extension points that remain INERT.

mode: public               # "public" | "private" (private becomes operational in v2)
soul_path: soul.md         # agent identity
facts_dir: facts           # facts directory by interlocutor/channel
adapter: os_capture        # source adapter (MVP: OS-level capture)
llm_provider: grok         # "grok" | "deepseek" (real implementation in slice 02)

# Required when adapter == os_capture: describes what to capture from the local
# machine (for example a Teams call). The live adapter arrives in v2.
os_capture:
  audio: true              # capture system audio
  video: true              # capture the screen
  audio_chunk_seconds: 1.0 # audio chunk size in seconds
  video_fps: 1.0           # frames per second sampled from the screen
  monitor: 1               # monitor index to capture (>= 1)

senser_interval: 0.5       # Senser cadence in seconds
idle_interval: 150.0       # proactive comment without triggers, in seconds
recent_chat_window: 15     # recent chat messages included in the prompt

llm_params:
  model: x-ai/grok-4.5
  reasoning:
    effort: low            # low | medium | high

# --- v2 extension points (present but inert in the MVP) ---
disclosure:
  announce_ai: false       # whether the agent discloses that it is AI

retention:
  perceptions_days: 7      # reserved/inert: delete artifacts manually
