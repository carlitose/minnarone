# Chat-only Twitch runtime example.
# Output stays on the console public router. The send block below defaults to
# off (no PRIVMSG sent). See the operator guide for shadow/live enablement.
# Secrets stay in environment variables:
#   TWITCH_BOT_USERNAME    (read-only IRC ingestion)
#   TWITCH_OAUTH_TOKEN     (read-only IRC ingestion)
#   TWITCH_SEND_OAUTH_TOKEN (write-scope token, only needed for shadow/live)

mode: public
soul_path: soul.md
facts_dir: facts
adapter: twitch
llm_provider: grok
agent_name: minnarone

twitch:
  channel: minnarone
  quality: best
  chat: true
  # Set audio: true for local audio perception after:
  #   uv sync --extra audio
  # and after configuring speaker_embedding.model_path below.
  audio: false
  # Set video: true to enable Twitch video frame events. The top-level
  # `video:` block below tunes perception sampling/dedup after frames arrive;
  # `vlm.model` must point at a local Qwen2-VL-compatible model.
  video: false
  audio_chunk_seconds: 1.0
  video_fps: 1.0
  # Public send is off by default. Uncomment and set mode to shadow for
  # rehearsal; see the operator guide before enabling live.
  # send:
  #   mode: off
  #   allowed_channels: []
  #   max_per_minute: 1
  #   max_per_hour: 20
  #   failure_threshold: 3

senser_interval: 0.5
idle_interval: 150.0
summarizer_interval: 30.0
recent_chat_window: 15
perception_queue_size: 32
perception_shutdown_timeout: 5.0

vad:
  mode: 2
  frame_ms: 30
  padding_ms: 300
  max_utterance_seconds: 30.0

asr:
  model: large-v3-turbo
  device: auto
  compute_type: default
  language: null
  beam_size: 5
  condition_on_previous_text: false

speaker_embedding:
  # Point this at a local sherpa-onnx speaker embedding ONNX model
  # (for example a CAM++ 192-dimensional model). No model is downloaded by
  # Minnarone.
  model_path: null
  provider: cpu
  num_threads: 1
  dimension: 192

speaker_clustering:
  threshold: 0.6
  warmup_seconds: 60.0
  min_update_seconds: 1.0

video:
  sample_every: 1
  dedup_change_threshold: 0.0

vlm:
  # Point this at a local Hugging Face Qwen2-VL-compatible model directory or
  # model id after installing the optional VLM runtime:
  #   uv sync --extra video --extra vlm
  model: null
  device: auto
  device_map: auto
  torch_dtype: auto
  attn_implementation: null
  max_new_tokens: 48
  timeout_seconds: 30.0
  language: en
  prompt: >-
    Describe the visible Twitch stream scene in one concise English sentence.
    Mention only observable gameplay, UI, people, and readable text.
    Do not speculate.
  max_caption_chars: 240
  max_image_edge: 768
  max_image_pixels: 500000

commentator:
  language: it
  # No profiles: commentator is disabled. The default public-chat persona
  # remains available.

llm_params:
  thinking: low

disclosure:
  announce_ai: false

retention:
  perceptions_days: 7

auto_memory: false
