# Example configuration with a local LLM through llama.cpp (no OPENROUTER_API_KEY).
#
# Prerequisite: start `llama-server` MANUALLY in another terminal, for example:
#   llama-server -m gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf --port 8080 -ngl 99 -c 8192 --reasoning off --parallel 1
#
# Minnarone DOES NOT manage the server process: when the live loop starts, it
# only performs a health check at GET {base_url}/health (200 = model loaded).

mode: public
soul_path: soul.md
facts_dir: facts
adapter: os_capture
llm_provider: llamacpp     # local provider: OpenAI-compatible llama-server

llamacpp:
  base_url: http://127.0.0.1:8080  # llama-server address (explicit port)

# Perception: screen only here, so the config passes `--check` without other
# models. The VLM captioner remains OFF (no `vlm.model`): on small GPUs, avoid
# running the torch Qwen2-VL backend beside llama-server. Audio also requires
# VAD/ASR and `speaker_embedding.model_path` (see
# minnarone.example.yaml).
os_capture:
  audio: false
  video: true
  video_fps: 1.0

# Video captioning on the SAME multimodal llama-server instance: uncomment the
# `vlm` block below and restart the server with `--mmproj <mmproj.gguf>` and
# `--parallel 2`, BUT use `-c 16384` (context is split across slots: parallel 2
# needs 16384 for 8192 tokens per request; -c 4096 would provide only 2048/slot
# and a multi-channel prompt would exceed it -> 400). The backend reuses
# `llamacpp.base_url` above: no duplicate torch-VLM + LLM residency in VRAM.
# At live startup, the CLI checks vision through GET /props (error without --mmproj).
# vlm:
#   backend: llamacpp

senser_interval: 0.5
idle_interval: 150.0
recent_chat_window: 15

llm_params:
  temperature: 0.7         # tuning passed in the request body
  max_tokens: 256
  # NOTE: `thinking` (used by cloud providers) is unnecessary here: llamacpp
  # drops it; reasoning is disabled server-side with `--reasoning off`.
