# Ready-to-use preset: FULL Teams meeting assistant through OS capture.
#
# Observe local-machine audio and screen (a Teams call) and produce comments
# (operator), periodic summaries (synthesizer), and contextual suggestions
# (suggester), PRIVATE for the operator only. All three profiles run in
# parallel with independent Reactors. There is no public output or external
# chat. Credentials/API keys stay OUT of this file: the LLM provider reads the
# key from the environment (for example OPENROUTER_API_KEY).
#
# Active profiles:
#   - operator: proactive comments every 30s of inactivity
#   - meeting_synthesizer: structured summary every 180s
#   - suggester: contextual suggestions on every audio perception
#
# COST NOTE: three profiles = three independent LLM call streams. For a
# one-hour meeting, expect roughly 20 synthesizer calls + 50-100 suggester
# calls + N operator calls. See docs/meeting-assistant-operator.md.
#
# Dry-run validation (no hardware opened, no network):
#   python -m minnarone examples/teams-meeting-full.yaml --check

mode: private              # required with active commentator profiles (local output only)
soul_path: original-chat-memory/soul.md  # agent identity (relative to this file)
facts_dir: original-chat-memory/facts    # facts directory by interlocutor/channel
adapter: os_capture        # source: OS-level audio/video capture
llm_provider: grok         # LLM provider; the API key comes from the environment
agent_name: minnarone      # name the agent recognizes as addressing itself

# What to capture from the local machine during the Teams call. Conservative
# values follow the ADR backpressure policy: low fps and small audio chunks
# avoid saturating the perception work queue.
os_capture:
  audio: true              # capture system audio (participant voices)
  video: true              # capture the screen (slides, faces, shared text)
  audio_chunk_seconds: 1.0 # audio chunk size in seconds
  video_fps: 1.0           # screen frames per second (intentionally low)
  monitor: 1               # monitor index to capture (>= 1)

# Full commentator mode: private comments + summaries + suggestions.
commentator:
  language: it             # language shared by all profiles
  profiles:
    operator:
      idle_interval: 30.0  # proactive comment without triggers, in seconds
    meeting_synthesizer:
      interval_s: 180      # summary every 3 minutes (recommended range: 120-300s)
    suggester: {}           # contextual suggestions; no specific parameters

senser_interval: 0.5       # Senser cadence in seconds
idle_interval: 150.0       # global proactive fallback without triggers, in seconds
summarizer_interval: 30.0  # Summarizer cadence (short-term memory)
recent_chat_window: 20     # recent perceptions included in the prompt
perception_queue_size: 32  # perception work-queue cap (backpressure)
perception_shutdown_timeout: 5.0

llm_params:
  model: x-ai/grok-4.5
  reasoning:
    effort: low            # low | medium | high

# Local vision captioning (Qwen2-VL). The backend default prompt targets Twitch
# streams and can make the model invent Twitch context; a Teams call needs a
# neutral prompt focused on visible screen content.
vlm:
  language: it
  prompt: >-
    Describe the visible screen content in one concise Italian sentence.
    It may be a video call, shared slides, documents, or applications.
    Mention only observable people, windows, UI, and readable text.
    Do not speculate.

# --- v2 extension points (present but inert in the MVP) ---
disclosure:
  announce_ai: false       # whether the agent discloses that it is AI

retention:
  perceptions_days: 7      # reserved/inert: delete artifacts manually
