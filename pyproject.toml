[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minnarone"
version = "0.0.1"
description = "Framework per agenti percettivi multimodali real-time (percezione locale + reazione LLM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pyyaml>=6",
    "webrtcvad-wheels>=2.0.14",
]

[project.scripts]
minnarone = "minnarone.cli:main"
minnarone-twitch-chat-smoke = "minnarone.twitch_smoke:chat_main"
minnarone-twitch-smoke = "minnarone.twitch_smoke:main"

[project.optional-dependencies]
dev = [
    "deptry>=0.25.1",
    "pylint>=4.0.6",
    "pytest>=8",
    "ruff>=0.15.19",
    "vulture>=2.16",
]
asr = ["faster-whisper>=1.1.0"]
speaker = [
    "sherpa-onnx>=1.12.40,<1.13",
    "sherpa-onnx-core>=1.12.40,<1.13",
]
audio = [
    "faster-whisper>=1.1.0",
    "sherpa-onnx>=1.12.40,<1.13",
    "sherpa-onnx-core>=1.12.40,<1.13",
]
video = [
    "av>=13",
    "numpy>=1.26",
    "streamlink>=6",
]
# Cattura audio di sistema (loopback) via soundcard. Opzionale: import lazy in
# make_device_capture_source, così il core si carica senza soundcard/numpy.
os-capture = [
    "numpy>=1.26",
    "soundcard>=0.4",
]
vlm = [
    "accelerate>=0.26",
    "pillow>=10",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.57",
]
# Dashboard di osservabilità (TUI). Opzionale: il modello di snapshot
# (minnarone.dashboard) funziona senza textual; solo la vista live lo richiede.
tui = ["textual>=0.50"]

[tool.hatch.build.targets.wheel]
packages = ["src/minnarone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
sort_by_size = true

[tool.deptry]
known_first_party = ["minnarone"]
optional_dependencies_dev_groups = ["dev"]
package_module_name_map = { textual = ["textual"], "webrtcvad-wheels" = ["webrtcvad"], "faster-whisper" = ["faster_whisper"], "sherpa-onnx" = ["sherpa_onnx"], "sherpa-onnx-core" = ["sherpa_onnx"], pillow = ["PIL"] }
per_rule_ignores = { DEP002 = ["accelerate", "sherpa-onnx", "sherpa-onnx-core", "torchvision"] }

[tool.pylint.main]
jobs = 0
persistent = false
py-version = "3.11"

[tool.pylint."messages control"]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.reports]
score = false

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
min-similarity-lines = 12
