[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minnarone"
version = "0.0.1"
description = "Framework per agenti percettivi multimodali real-time (percezione locale + reazione LLM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Dashboard di osservabilità (TUI). Opzionale: il modello di snapshot
# (minnarone.dashboard) funziona senza textual; solo la vista live lo richiede.
tui = ["textual>=0.50"]

[tool.hatch.build.targets.wheel]
packages = ["src/minnarone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
