[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minnarone"
version = "0.0.1"
description = "Framework per agenti percettivi multimodali real-time (percezione locale + reazione LLM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["pyyaml>=6"]

[project.scripts]
minnarone = "minnarone.cli:main"
minnarone-twitch-chat-smoke = "minnarone.twitch_smoke:main"

[project.optional-dependencies]
dev = [
    "deptry>=0.25.1",
    "pylint>=4.0.6",
    "pytest>=8",
    "ruff>=0.15.19",
    "vulture>=2.16",
]
# Dashboard di osservabilità (TUI). Opzionale: il modello di snapshot
# (minnarone.dashboard) funziona senza textual; solo la vista live lo richiede.
tui = ["textual>=0.50"]

[tool.hatch.build.targets.wheel]
packages = ["src/minnarone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
sort_by_size = true

[tool.deptry]
known_first_party = ["minnarone"]
optional_dependencies_dev_groups = ["dev"]
package_module_name_map = { textual = ["textual"] }

[tool.pylint.main]
jobs = 0
persistent = false
py-version = "3.11"

[tool.pylint."messages control"]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.reports]
score = false

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
min-similarity-lines = 12
